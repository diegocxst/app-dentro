<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Menú lateral dentro</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Plus+Jakarta+Sans:wght@600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#FFFFFF}a:hover{color:#FFFFFF}
</style>
</helmet>
<nav aria-label="Menú principal" style="box-sizing: border-box; width: 100%; height: 100%; min-height: 900px; background: #1E1240; color: #FFFFFF; font-family: 'Inter', system-ui, sans-serif; padding: 24px 16px; display: flex; flex-direction: column; gap: 24px">
<div style="display: flex; flex-direction: column; gap: 12px; padding: 4px 8px 16px; border-bottom: 1px solid #33295A">
<div role="img" aria-label="Logo de Clínica Dental Sonríe" style="width: 52px; height: 52px; border-radius: 14px; background: {{clinicColor}}; display: flex; align-items: center; justify-content: center; font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 800; font-size: 18px; color: #FFFFFF; letter-spacing: 0.02em">CS</div>
<div style="display: flex; flex-direction: column; gap: 2px; min-width: 0">
<span style="font-family: 'Plus Jakarta Sans', sans-serif; font-size: 17px; font-weight: 700; line-height: 22px">Clínica Dental Sonríe</span>
<span style="font-size: 13px; line-height: 18px; color: #B9B2C8">Dra. Ana Ruiz · Propietaria</span>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 4px">
<sc-for list="{{items}}" as="item" hint-placeholder-count="10">
<a href="{{item.href}}" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 10px; text-decoration: none; font-size: 14px; font-weight: 500; background: {{item.bg}}; color: {{item.fg}}">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{item.d}}"></path></svg>
<span style="flex-grow: 1">{{item.label}}</span>
<sc-if value="{{item.badge}}" hint-placeholder-val="{{false}}">
<span style="font-size: 12px; font-weight: 600; line-height: 16px; padding: 2px 8px; border-radius: 999px; background: #FF8A3D; color: #1E1240">{{item.badge}}</span>
</sc-if>
</a>
</sc-for>
</div>
<div style="flex-grow: 1"></div>
<a href="Main-Bienvenida.dc.html" style="display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 0 12px; border-radius: 10px; background: #2B1B60; text-decoration: none; font-size: 13px; font-weight: 600; color: #FFFFFF">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#2DD4E0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .8-1 1.5v.7M12 17h.01"></path></svg>
<span style="flex-grow: 1">Guía de inicio</span>
<span style="font-size: 12px; color: #B9B2C8">3/7</span>
</a>
<div style="display: flex; align-items: center; gap: 8px; padding: 12px 8px 0; border-top: 1px solid #33295A">
<span style="font-size: 11px; color: #B9B2C8">Hecho con</span>
<img src="/brand/dentro-horizontal-negativo.svg" alt="dentro" style="width: 72px; height: auto; display: block">
</div>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["inicio","agenda","leads","pacientes","presupuestos","cobros","seguimientos","doctores","crece","configuracion"],"default":"inicio"},"clinicColor":{"editor":"color","options":["#0E5E8A","#B42A5B","#2F6B3A","#7C4DFF"],"default":"#0E5E8A"},"$preview":{"width":248,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const active = this.props.active ?? 'inicio';
    const list = [
      { id: 'inicio', label: 'Inicio', href: 'Main.dc.html', d: 'M3 11l9-7 9 7M5 10v10h14V10M10 20v-5h4v5' },
      { id: 'agenda', label: 'Agenda', href: 'Agenda.dc.html', d: 'M4 6h16v14H4zM4 10h16M8 3v4M16 3v4' },
      { id: 'leads', label: 'Leads', href: 'Leads.dc.html', d: 'M4 13l3-8h10l3 8v6H4zM4 13h5l1 2h4l1-2h5', badge: '5' },
      { id: 'pacientes', label: 'Pacientes', href: 'Paciente.dc.html', d: 'M9 11a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM3 20c0-3 3-5 6-5s6 2 6 5M16 5a3 3 0 0 1 0 6M18 15c2 .5 3 2.5 3 5' },
      { id: 'presupuestos', label: 'Presupuestos', href: 'Presupuestos.dc.html', d: 'M6 3h9l4 4v14H6zM15 3v4h4M9 12h7M9 16h7' },
      { id: 'cobros', label: 'Cobros', href: 'Main.dc.html', d: 'M3 6h18v12H3zM3 10h18M7 15h3' },
      { id: 'seguimientos', label: 'Seguimientos', href: 'Main.dc.html', d: 'M4 4h16v16H4zM8 12l3 3 5-6' },
      { id: 'doctores', label: 'Doctores', href: 'Comisiones.dc.html', d: 'M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM5 21c0-4 3-6 7-6s7 2 7 6' },
      { id: 'crece', label: 'Crece tu clínica', href: 'Main.dc.html', d: 'M3 17l6-6 4 4 8-8M15 7h6v6' },
      { id: 'configuracion', label: 'Configuración', href: 'Onboarding.dc.html', d: 'M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M14 4v4M8 10v4M16 16v4' }
    ];
    const items = list.map((it) => ({
      ...it,
      badge: it.badge ?? '',
      bg: it.id === active ? '#33295A' : 'transparent',
      fg: it.id === active ? '#FFFFFF' : (it.id === 'crece' ? '#FFAA70' : '#B9B2C8')
    }));
    return { items, clinicColor: this.props.clinicColor ?? '#0E5E8A' };
  }
}
</script>
</body>
</html>
