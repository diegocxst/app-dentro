<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Leads</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Plus+Jakarta+Sans:wght@600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#6A35F0}a:hover{color:#1E1240}
</style>
</helmet>
<div style="box-sizing: border-box; width: 100%; min-height: 1000px; display: flex; flex-wrap: wrap; background: #FBFAFD; font-family: 'Inter', system-ui, sans-serif; color: #1C1726">
<div style="flex: 1 1 240px; display: flex">
<dc-import name="Menu" active="leads" hint-size="100%,1000px" style="flex-grow: 1"></dc-import>
</div>
<main style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column">
<dc-import name="Barra" hint-size="100%,64px"></dc-import>
<div style="box-sizing: border-box; width: 100%; padding: 32px; display: flex; flex-direction: column; gap: 20px">

<div style="display: flex; flex-wrap: wrap; align-items: flex-end; gap: 16px">
<div style="flex: 1 1 320px; display: flex; flex-direction: column; gap: 4px">
<h1 style="margin: 0; font-family: 'Plus Jakarta Sans', sans-serif; font-size: 28px; line-height: 36px; font-weight: 700">Leads</h1>
<p style="margin: 0; font-size: 14px; color: #5E5869">Personas interesadas que todavía no son pacientes.</p>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<button type="button" style="display: flex; align-items: center; gap: 8px; min-height: 40px; padding: 0 14px; border: 1px solid #E6E2EC; border-radius: 12px; background: #FFFFFF; font: inherit; font-size: 14px; font-weight: 500; cursor: pointer">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#5E5869" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M7 12h10M10 18h4"></path></svg>
Origen: todos
</button>
<button type="button" style="display: flex; align-items: center; gap: 8px; min-height: 40px; padding: 0 16px; border: 0; border-radius: 12px; background: #6A35F0; color: #FFFFFF; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
Nuevo lead
</button>
</div>
</div>

<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px">
<div style="padding: 16px 20px; border-radius: 16px; background: #FFFFFF; border: 1px solid #E6E2EC; display: flex; flex-direction: column; gap: 4px"><span style="font-size: 13px; color: #5E5869">Leads este mes</span><strong style="font-family: 'Plus Jakarta Sans', sans-serif; font-size: 24px; line-height: 32px">48</strong></div>
<div style="padding: 16px 20px; border-radius: 16px; background: #FFFFFF; border: 1px solid #E6E2EC; display: flex; flex-direction: column; gap: 4px"><span style="font-size: 13px; color: #5E5869">Llegaron a valoración</span><strong style="font-family: 'Plus Jakarta Sans', sans-serif; font-size: 24px; line-height: 32px">31%</strong></div>
<div style="padding: 16px 20px; border-radius: 16px; background: #FFFFFF; border: 1px solid #E6E2EC; display: flex; flex-direction: column; gap: 4px"><span style="font-size: 13px; color: #5E5869">Tiempo de respuesta</span><strong style="font-family: 'Plus Jakarta Sans', sans-serif; font-size: 24px; line-height: 32px">2 h 10 min</strong></div>
<div style="padding: 16px 20px; border-radius: 16px; background: #FFEEDF; display: flex; flex-direction: column; gap: 4px"><span style="font-size: 13px; color: #B4500F">Sin contestar hace más de 24 h</span><strong style="font-family: 'Plus Jakarta Sans', sans-serif; font-size: 24px; line-height: 32px; color: #1C1726">3</strong></div>
</div>

<div style="overflow-x: auto; padding-bottom: 8px">
<div style="display: grid; grid-template-columns: repeat(5, minmax(240px, 1fr)); gap: 16px; min-width: 1240px">
<sc-for list="{{cols}}" as="col" hint-placeholder-count="5">
<section style="display: flex; flex-direction: column; gap: 10px; padding: 12px; border-radius: 16px; background: #F4F1F9">
<div style="display: flex; align-items: center; gap: 8px; padding: 4px 4px 6px">
<span aria-hidden="true" style="width: 8px; height: 8px; border-radius: 999px; background: {{col.color}}"></span>
<h2 style="margin: 0; flex-grow: 1; font-size: 14px; font-weight: 600">{{col.title}}</h2>
<span style="font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: #FFFFFF; color: #5E5869">{{col.count}}</span>
</div>
<sc-for list="{{col.cards}}" as="c" hint-placeholder-count="3">
<article style="display: flex; flex-direction: column; gap: 10px; padding: 14px; border-radius: 12px; background: #FFFFFF; border: 1px solid #E6E2EC">
<div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 8px">
<span style="font-size: 14px; font-weight: 600">{{c.name}}</span>
<span style="font-size: 12px; color: {{c.ageColor}}; white-space: nowrap">{{c.age}}</span>
</div>
<span style="font-size: 13px; line-height: 18px; color: #5E5869">{{c.interest}}</span>
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 6px">
<span style="font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 999px; background: {{c.srcBg}}; color: {{c.srcFg}}">{{c.source}}</span>
<span style="flex-grow: 1"></span>
<a href="Leads.dc.html" aria-label="Escribir por WhatsApp a {{c.name}}" style="width: 36px; height: 36px; border-radius: 10px; border: 1px solid #E6E2EC; display: flex; align-items: center; justify-content: center; color: #0B7F86">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20l1.3-3.9A8 8 0 1 1 8 19z"></path><path d="M9 10c0 3 2 5 5 5l1-1.5-2-1-1 1c-1-.5-1.5-1-2-2l1-1-1-2z"></path></svg>
</a>
<a href="Agenda.dc.html" aria-label="Agendar valoración para {{c.name}}" style="width: 36px; height: 36px; border-radius: 10px; border: 1px solid #E6E2EC; display: flex; align-items: center; justify-content: center; color: #6A35F0">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16v14H4zM4 10h16M8 3v4M16 3v4"></path></svg>
</a>
</div>
</article>
</sc-for>
</section>
</sc-for>
</div>
</div>

</div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1000}}'>
class Component extends DCLogic {
  renderVals() {
    const src = {
      meta: { source: 'Anuncio en Meta', srcBg: '#DDF7F6', srcFg: '#0B7F86' },
      perfil: { source: 'Perfil público', srcBg: '#F0EBFF', srcFg: '#6A35F0' },
      ref: { source: 'Referido', srcBg: '#E6EFFC', srcFg: '#2563C9' },
      wa: { source: 'WhatsApp', srcBg: '#E3F4EC', srcFg: '#1A7A50' }
    };
    const card = (name, interest, s, age, late) => ({ name, interest, ...src[s], age, ageColor: late ? '#C2334A' : '#5E5869' });
    const cols = [
      { title: 'Nuevo', color: '#2563C9', cards: [
        card('Fernanda Lozano', 'Quiere precio de ortodoncia invisible', 'meta', 'hace 26 h', true),
        card('Carlos Medina', 'Dolor en muela, pide cita urgente', 'wa', 'hace 40 min'),
        card('Paola Reyes', 'Blanqueamiento antes de su boda', 'perfil', 'hace 2 h'),
        card('Héctor Salas', 'Implante, le falta una pieza', 'meta', 'hace 30 h', true)
      ] },
      { title: 'Contactado', color: '#8A6100', cards: [
        card('Gabriela Núñez', 'Ortodoncia para su hija de 12', 'ref', 'ayer'),
        card('Roberto Aguilar', 'Limpieza y revisión', 'meta', 'hace 2 días'),
        card('Ximena Castillo', 'Carillas, pidió fotos de casos', 'perfil', 'hace 3 días')
      ] },
      { title: 'Valoración agendada', color: '#6A35F0', cards: [
        card('Andrés Lara', 'Valoración hoy 16:30', 'meta', 'hoy'),
        card('Laura Méndez', 'Valoración hoy 10:00', 'perfil', 'hoy')
      ] },
      { title: 'Convertido en paciente', color: '#1A7A50', cards: [
        card('Sofía Guzmán', 'Carillas · presupuesto enviado', 'meta', '3 nov'),
        card('Jorge Ramírez', 'Implante · en tratamiento', 'ref', '28 oct')
      ] },
      { title: 'Perdido', color: '#C2334A', cards: [
        card('Iván Morales', 'Eligió otra clínica por precio', 'meta', '30 oct')
      ] }
    ].map((c) => ({ ...c, count: c.cards.length }));
    return { cols };
  }
}
</script>
</body>
</html>
